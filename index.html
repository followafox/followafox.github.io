<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Pages - Random CSV Selector</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f9f9f9; color: #333; }
        pre { background: #272822; color: #f8f8f2; padding: 20px; border-radius: 6px; overflow-x: auto; }
        button { padding: 10px 15px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 4px; font-size: 14px; }
        button:hover { background: #0051b3; }
        .counter { color: #666; font-size: 0.9em; margin-top: 10px; }
        .error { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Unique Random CSV Row Picker</h2>
    <p>Running directly on GitHub Pages server environments.</p>
    
    <button id="randomizeBtn" disabled>Fetching data...</button>
    <div id="poolStatus" class="counter">Connecting to GitHub file stream...</div>
    
    <h3>Result Output:</h3>
    <pre id="jsonOutput">// JSON data will stream here...</pre>

    <script>
        let cachedRows = [];
        let availableIndices = [];

        // Safe CSV line splitter that handles quotes and commas natively
        function parseCSVLine(line) {
            const result = [];
            const regex = /"([^"]*)"|([^,]+)/g;
            let match;

            while ((match = regex.exec(line)) !== null) {
                const value = match[1] !== undefined ? match[1] : match[2];
                result.push(value.trim());
            }
            return result;
        }

        function processRandomRow() {
            if (cachedRows.length <= 1) return;

            // Reset the tracking pool once all unique entries are exhausted
            if (availableIndices.length === 0) {
                for (let i = 1; i < cachedRows.length; i++) {
                    availableIndices.push(i);
                }
                console.log("All unique rows viewed. Pool reset.");
            }

            // 1. Pick a random index coordinate from our remaining index pool
            const poolIndex = Math.floor(Math.random() * availableIndices.length);
            const targetRowIndex = availableIndices[poolIndex];

            // 2. Remove this index from the pool so it cannot repeat
            availableIndices.splice(poolIndex, 1);

            // Update user status interface
            const totalDataRows = cachedRows.length - 1;
            const rowsViewed = totalDataRows - availableIndices.length;
            document.getElementById('poolStatus').textContent = `Showing row ${rowsViewed} of ${totalDataRows} total unique rows.`;

            // 3. Extract headers and the selected target row columns
            const headers = parseCSVLine(cachedRows[0]);
            const columns = parseCSVLine(cachedRows[targetRowIndex]);

            // 4. Map the columns to header properties
            const rowMap = {};
            headers.forEach((header, index) => {
                rowMap[header] = columns[index] || "";
            });

            // 5. Separate and isolate requested target fields
            const targetFields = ["Quotation", "Author", "Work", "Notes"];
            const result = {};

            targetFields.forEach(field => {
                const exactHeader = headers.find(h => h.toLowerCase() === field.toLowerCase());
                result[field] = exactHeader ? rowMap[exactHeader] : "";
            });

            // 6. Output formatted text to the screen
            document.getElementById('jsonOutput').className = "";
            document.getElementById('jsonOutput').textContent = JSON.stringify(result, null, 2);
        }

        // GitHub Pages compatible relative path finder
        async function loadCSVFile() {
            try {
                // Extracts the base path layout to maintain sub-repository structure safely
                const baseDir = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                const targetUrl = window.location.origin + baseDir + 'todayiam.csv';

                const response = await fetch(targetUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const textContent = await response.text();
                
                // Break text content into lines and drop completely empty lines
                cachedRows = textContent.trim().split(/\r?\n/).filter(line => line.trim() !== "");
                
                if (cachedRows.length > 1) {
                    const btn = document.getElementById('randomizeBtn');
                    btn.textContent = "Pick Next Random Row";
                    btn.removeAttribute('disabled');
                    processRandomRow();
                } else {
                    throw new Error("The target CSV file contains no structural headers or data rows.");
                }
            } catch (error) {
                document.getElementById('poolStatus').textContent = "";
                const output = document.getElementById('jsonOutput');
                output.className = "error";
                output.textContent = `GitHub Pages Server Error:\n\nEnsure 'todayiam.csv' is committed in lowercase to the exact same repository folder branch as your 'index.html' file.\n\nDetails: ${error.message}`;
            }
        }

        // Trigger file pipeline on initial page load
        document.getElementById('randomizeBtn').addEventListener('click', processRandomRow);
        window.addEventListener('DOMContentLoaded', loadCSVFile);
    </script>
</body>
</html>
