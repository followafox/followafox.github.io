<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random CSV Entry Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .display-box {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }
        .data-text {
            font-size: 1.1rem;
            color: #4a4a4a;
            margin: 0;
        }
        .meta-info {
            font-size: 0.85rem;
            color: #999;
            margin-top: 15px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Random Entry Generator</h1>
    
    <div class="display-box" id="displayBox">
        <p class="data-text" style="color: #888;">Loading data from todayiam.csv...</p>
    </div>

    <button id="nextBtn" onclick="displayRandomEntry()" disabled>Generate New Entry</button>
    <div class="meta-info" id="tracker">Remaining: 0/0</div>
</div>

<script>
    let jsonData = [];
    let availableIndices = [];

    // Fetch and parse the external CSV file
    function init() {
        // Fetching "todayiam.csv" from the same directory
        fetch('todayiam.csv')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Could not find todayiam.csv (Status: ${response.status})`);
                }
                return response.text();
            })
            .then(csvText => {
                Papa.parse(csvText, {
                    skipEmptyLines: true,
                    complete: function(results) {
                        processData(results.data);
                    },
                    error: function(err) {
                        showError("Error parsing the CSV file.");
                    }
                });
            })
            .catch(error => {
                showError(error.message + "<br><small style='color:#be6d6d;'>Note: If opening the HTML directly from your file system, browsers block file fetching for security. Run a local development server or upload to a host to view.</small>");
                console.error(error);
            });
    }

    function showError(message) {
        document.getElementById('displayBox').innerHTML = `<p class="data-text" style="color: red; font-size:0.95rem;">${message}</p>`;
    }

    function processData(matrix) {
        // If your CSV has headers, we start looping from index 1. 
        // If your CSV has NO header row, change 'i = 1' to 'i = 0'.
        for (let i = 1; i < matrix.length; i++) {
            const row = matrix[i];
            
            // Check if row has enough columns (at least 4 columns to grab indices 1, 2, and 3)
            if (row.length >= 4) {
                jsonData.push({
                    col2: row, // 2nd column
                    col3: row, // 3rd column
                    col4: row  // 4th column
                });
            }
        }
        
        if (jsonData.length === 0) {
            showError("No valid rows found in CSV. Make sure it has at least 4 columns.");
            return;
        }

        resetPool();
        document.getElementById('nextBtn').disabled = false;
        displayRandomEntry();
    }

    // Resets the pool of available indices when all are used
    function resetPool() {
        availableIndices = Array.from({ length: jsonData.length }, (_, i) => i);
    }

    // Pick a random entry without repeating until the table is exhausted
    function displayRandomEntry() {
        if (jsonData.length === 0) return;

        // If pool is empty, reset it to allow repeating the cycle
        if (availableIndices.length === 0) {
            alert("All entries shown! Resetting the pool.");
            resetPool();
        }

        // Pick a random index from our remaining available indices pool
        const poolIndex = Math.floor(Math.random() * availableIndices.length);
        const dataIndex = availableIndices[poolIndex];

        // Remove the chosen index from the available pool
        availableIndices.splice(poolIndex, 1);

        // Display the selected item's 2nd, 3rd, and 4th columns
        const entry = jsonData[dataIndex];
        const displayBox = document.getElementById('displayBox');
        
        displayBox.innerHTML = `
            <p class="data-text"><strong>Column 2:</strong> ${entry.col2}</p>
            <p class="data-text"><strong>Column 3:</strong> ${entry.col3}</p>
            <p class="data-text"><strong>Column 4:</strong> ${entry.col4}</p>
        `;

        // Update the counter UI
        document.getElementById('tracker').innerText = `Remaining in pool: ${availableIndices.length} / ${jsonData.length}`;
    }

    // Run on page load
    window.onload = init;
</script>

</body>
</html>
